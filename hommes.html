<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
    <style type="text/tailwindcss">
      @theme {
        --color-vert: #10b981;
        --color-pri:#4f46e5;
        --color-but:#10b981;
        --color-fond:#f1f1f1;
        --background-image-moi:url('IMAGE/Pull Over.jpg');
        --background-image-moi1:url('IMAGE/Polo Premium.jpg');
        --background-image-moi2:url('IMAGE/Bermuda Chino.jpg');
        --background-image-moi3:url('IMAGE/Sweat Capuche.jpg');
        --shadow-shado: 0 2px 8px rgba(0,0,0,0.2);
        
      }
    </style>
</head>
<body class=" m-20">
    <h1 class="font-bold text-2xl mb-10">Nouveautés</h1>

    <div class="flex gap-7 flex-col md:flex-row  ">

        <div class="bg-fond w-60  shadow-shado hover:shadow-lg transition duration-500">
           <div class="bg-moi bg-cover  w-60 h-50 "><p class="bg-vert text-white font-bold w-20 ml-2 ">NOUVEAU</p>
         </div> 
            <h3 class="font-bold pl-4 pt-4">Pull Over</h3>
            <p class="opacity-70 pl-4 pt-1">Laine mérinos</p>
            <div class="flex justify-around gap-15 pt-4 ">
            <p class="text-pri font-bold text-2xl">79,99€</p>
            <button class="bg-but text-white  pr-3 pl-2 rounded-[10px] ">+ Panier</button>
        </div>
        </div>

        <div class="bg-fond w-70 pb-5 shadow-shado hover:shadow-lg transition duration-500">
           <div class="bg-moi1 bg-cover w-70 h-70 ">
        <p class="bg-vert text-white font-bold w-20 ml-2 ">NOUVEAU</p> </div> 
            <h3  class="font-bold pl-4 pt-4">Polo Premium</h3>
            <p class="opacity-70 pl-4 pt-1" >Coton piqué</p>
            <div class="flex justify-around gap-15 pt-4 ">
            <p class="text-pri font-bold text-2xl">39,99 €</p>
            <button class="bg-but text-white  pr-3 pl-2 rounded-[10px] ">+ Panier</button>
        </div>
        </div>

        <div class="bg-fond w-70 pb-5 shadow-shado hover:shadow-lg transition duration-500">
           <div class="bg-moi2 bg-cover w-70 h-70">
        <p class="bg-vert text-white font-bold w-20 ml-2 ">NOUVEAU</p> </div> 
            <h3 class="font-bold pl-4 pt-4">Bermuda Chino</h3>
            <p class="opacity-70 pl-4 pt-1">Coupe regular</p>
            <div class="flex justify-around gap-15 pt-4 ">
            <p class="text-pri font-bold text-2xl">44,99 €</p>
            <button class="bg-but text-white  pr-3 pl-2 rounded-[10px] ">+ Panier</button>
        </div>
        </div>

        <div class="bg-fond w-70 pb-5 shadow-shado hover:shadow-lg transition duration-500">
           <div class="bg-moi3 bg-cover bg-center w-70 h-70">
        <p class="bg-vert text-white font-bold w-20 ml-2 ">NOUVEAU</p> </div> 
            <h3 class="font-bold pl-4 pt-4">Sweat Capuche</h3>
            <p class="opacity-70 pl-4 pt-1">Molleton épais</p>
            <div class="flex justify-around gap-15 pt-4 ">
            <p class="text-pri font-bold text-2xl">54,99 €</p>
            <button class="bg-but text-white  pr-3 pl-2 rounded-[10px] ">+ Panier</button>
            </div>
        </div>
    </div>
    
</body>
</html>
